name: Pipeline smoke

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Typecheck and build frontend
        run: npm run build
      - name: Bootstrap CI data fixtures
        run: |
          cp data/candidate_preferences.example.json data/candidate_preferences.json
          cp data/master_claims.example.json data/master_claims.json
          cp data/workExperience.example.md data/workExperience.md
      - name: Verify master claims catalog
        run: python scripts/verify_master_claims.py
      - name: Smoke draft compiler (no LLM)
        run: python scripts/smoke_draft_compiler.py
      - name: Smoke regression (unit)
        run: python scripts/test_smoke_regression.py
